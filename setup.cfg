[metadata]
name = metron
version = 0.1.0
author = AXELTEC SOFTWARE LTD.
author_email = info@axel-t.com
description = Open-loop load tester for OpenAI-compatible inference endpoints.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/islavutin-oss/metron
license = Apache-2.0
classifiers =
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Topic :: System :: Benchmark

[options]
packages = find:
python_requires = >=3.9
exclude =
    node_modules
install_requires =
    numpy < 2.0.0
    python-dateutil
    python-dotenv
    requests
    transformers
    datasets

[options.entry_points]
console_scripts =
    metron = metron.__main__:main

[options.package_data]
metron =
    *.js
    configs/.env.*

[options.extras_require]
dev =
    pytest
    pre-commit
    # Pinned to the versions .pre-commit-config.yaml uses. CI calls `ruff`
    # directly, so leaving it out of here made the lint step fail with
    # command-not-found; leaving it unpinned would mean CI and a contributor's
    # pre-commit run disagree the day ruff adds a rule.
    ruff==0.6.8
    mypy==1.11.2
    fastapi
    uvicorn
    requests
